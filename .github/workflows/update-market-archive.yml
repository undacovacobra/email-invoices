# Adds the latest futures bars to the Pine Backtester's saved archive
# (pine-backtester/data), so its 1-minute history keeps growing past the ~30 days
# Yahoo serves. Vercel redeploys the site after each update.
#
# GitHub only runs scheduled workflows from the repository's default branch, so this
# file has to be on that branch (see pine-backtester/DEPLOY.md).
name: Update market data archive

on:
  schedule:
    - cron: "23 22 * * 5"   # Fridays 22:23 UTC, after the US futures close
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: market-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the branch the website is built from
          ref: ${{ vars.ARCHIVE_BRANCH || 'claude/hopeful-cerf-7ldpix' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the latest bars
        working-directory: pine-backtester
        run: node scripts/update-archive.mjs
      - name: Save them
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pine-backtester/data
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -m "Update market data archive"
            git push
          fi
